databases:
  - name: form-collector-db
    databaseName: formcollector
    user: formcollector
    plan: free

services:
  - type: web
    name: form-collector
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn project.wsgi:application --workers 2"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: form-collector-db
          property: connectionString
      - key: ADMIN_URL
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
